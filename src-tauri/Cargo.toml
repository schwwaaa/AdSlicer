[package]
name = "AdSlicer"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
anyhow = "1"
glob = "0.3"
walkdir = "2"
regex = "1"
dunce = "1"
sha2 = "0.10"
opencv = { version = "0.100.1", optional = true, default-features = false, features = ["clang-runtime", "imgproc", "videoio"] }

[features]
default = []
opencv-analysis = ["dep:opencv"]

# Keep this Tauri package isolated from unrelated Cargo workspaces in parent directories.
[workspace]
